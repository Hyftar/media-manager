# Variables (${...}) come from the .env generated by configuration.nix
name: cia-server

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s
  start_interval: 5s

networks:
  cia-network:
    driver: bridge
  cia-overlay:
    external: true
    name: cia-overlay

services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --watch
    ports:
      - 80:80
      - 443:443
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount the directory, not the file: deploys replace the file, and a
      # single-file bind mount would keep pointing at the old one.
      - ./caddy:/etc/caddy:ro
      - ${CONFIG_DIR}/caddy/data:/data
      - ${CONFIG_DIR}/caddy/config:/config
    networks:
      - cia-network
      - cia-overlay
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]

  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    restart: unless-stopped
    ports:
      - 5678:3552
    cgroup: host
    volumes:
      - ${CONFIG_DIR}/arcane:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path on the host and in the container, so relative paths in the
      # stacks resolve identically for Arcane and Docker.
      - ${STACKS_DIR}:${STACKS_DIR}
    environment:
      APP_URL: https://docker.grosluxe.ca
      PUID: ${ARCANE_UID}
      PGID: ${ARCANE_GID}
      TZ: ${TZ}
      ANALYTICS_DISABLED: "true"
      PROJECTS_DIRECTORY: ${STACKS_DIR}
    env_file:
      - ./secrets.env
    networks:
      - cia-network
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "./arcane", "health", "--timeout", "5s"]
