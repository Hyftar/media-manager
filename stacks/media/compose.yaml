# Variables (${...}) come from the .env generated by modules/media.nix
name: media-service

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s
  start_interval: 5s

services:
  emby:
    image: emby/embyserver:beta
    container_name: emby
    restart: unless-stopped
    environment:
      - UID=${EMBY_UID}
      - GID=${MEDIA_GID}
      - GIDLIST=${MEDIA_GID},${RENDER_GID}
    volumes:
      - ${CONFIG_DIR}/emby/backups:/backups
      - ${CONFIG_DIR}/emby/config:/config
      - ${MEDIA_DIR}/books:/media/books
      - ${MEDIA_DIR}/movies:/media/movies
      - ${MEDIA_DIR}/series:/media/series
      - ${MEDIA_DIR}/animes:/media/animes
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 8096:8096
      - 8920:8920
    devices:
      - /dev/dri:/dev/dri
    networks:
      - cia-network
    healthcheck:
      <<: *healthcheck
      start_period: 120s
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8096/emby/System/Ping"]

  sonarr:
    image: ghcr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${SONARR_UID}
      - PGID=${MEDIA_GID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${MEDIA_DIR}:/media
      - ${TORRENTS_DIR}:/media/torrents
      - ${INTAKE_DIR}:/media/series_intake
    ports:
      - 8989:8989
    networks:
      - cia-network
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8989/ping"]

  radarr:
    image: ghcr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${RADARR_UID}
      - PGID=${MEDIA_GID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${MEDIA_DIR}:/media
      - ${TORRENTS_DIR}:/media/torrents
      - ${INTAKE_DIR}:/media/movies_intake
    ports:
      - 7878:7878
    networks:
      - cia-network
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7878/ping"]

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=error
      - PUID=${SEERR_UID}
      - PGID=${MEDIA_GID}
      - TZ=${TZ}
      - PORT=5055
    ports:
      - 5055:5055
    volumes:
      - ${CONFIG_DIR}/jellyseerr:/app/config
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5055/api/v1/status"]
    networks:
      - cia-network

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${QBITTORRENT_UID}
      - PGID=${MEDIA_GID}
      - UMASK=007
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      # Same path as Deluge used, so Sonarr/Radarr need no remote path mapping.
      - ${TORRENTS_DIR}:/media/torrents
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    networks:
      - cia-network
    healthcheck:
      <<: *healthcheck
      # The login page answers without authentication.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]

  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PROWLARR_UID}
      - PGID=${MEDIA_GID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    ports:
      - 9696:9696
    networks:
      - cia-network
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9696/ping"]

networks:
  cia-network:
    external: true
    name: cia-server_cia-network
