# Variables (${...}) come from the .env generated by modules/immich.nix; the
# same file is passed to the containers through env_file.
name: immich-service

# Shared healthcheck timings; each service adds its own `test`.
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s
  start_interval: 5s

services:
  immich-server:
    container_name: immich_server
    group_add:
      - ${IMMICH_GID}
    image: ghcr.io/immich-app/immich-server:v3
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /mnt/storage/pictures:/mnt/storage/pictures
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - ./.env
    ports:
      - 2283:2283
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
      - nvidia.com/gpu=all
    networks:
      - cia-network
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "immich-healthcheck"]

  redis:
    container_name: immich_redis
    group_add:
      - ${IMMICH_GID}
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    labels:
      - com.getarcaneapp.arcane.updater=false
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "[ \"$$(valkey-cli ping)\" = PONG ]"]
    networks:
      - cia-network
    restart: unless-stopped

  database:
    container_name: immich_postgres
    group_add:
      - ${IMMICH_GID}
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    # Immich release notes say when the database image must change.
    labels:
      - com.getarcaneapp.arcane.updater=false
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    networks:
      - cia-network
    shm_size: 128mb
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}", "-d", "${DB_DATABASE_NAME}"]
    restart: unless-stopped

networks:
  cia-network:
    external: true
    name: cia-server_cia-network
